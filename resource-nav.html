<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>長照資源導航站</title>
  <link rel="stylesheet" href="./resource-nav.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">New Taipei Resource Navigator</p>
      <h1>長照資源導航站</h1>
    </div>
    <div class="status-pill" id="sourceStatus">Discord 入口</div>
  </header>

  <main class="page-shell">
    <section class="filter-panel" aria-label="資源篩選">
      <div class="filter-head">
        <div>
          <p class="eyebrow">查詢條件</p>
          <h2>先鎖定地區，再選需求</h2>
        </div>
      </div>

      <div class="filter-controls">
        <label class="field">
          <span>行政區</span>
          <select id="districtSelect">
            <option value="">不限行政區</option>
            <option>板橋區</option>
            <option>三重區</option>
            <option>中和區</option>
            <option>永和區</option>
            <option>新莊區</option>
            <option>新店區</option>
            <option>土城區</option>
            <option>蘆洲區</option>
            <option>汐止區</option>
            <option>樹林區</option>
            <option>淡水區</option>
            <option>全新北</option>
          </select>
        </label>
        <label class="field">
          <span>主題分類</span>
          <select id="categorySelect"></select>
        </label>
        <label class="field">
          <span>急迫性</span>
          <select id="urgencySelect">
            <option value="">不限</option>
            <option>一般</option>
            <option>本週內</option>
            <option>緊急</option>
          </select>
        </label>
      </div>

      <div class="choice-grid single-choice">
        <div class="choice-block">
          <div class="choice-title">
            <span>子主題</span>
            <small>可複選</small>
          </div>
          <div id="topicChips" class="chip-row"></div>
        </div>
      </div>

      <div class="smart-search">
        <label class="field">
          <span>智慧查詢補充</span>
          <input id="smartQueryInput" type="text" placeholder="補充描述，例如：獨居、最近沒錢買飯、家屬不穩定">
        </label>
        <div class="action-help">
          <button type="button" id="applySmartQuery">套用智慧查詢</button>
          <p>依補充描述排序與高亮卡片，不會直接刪掉其他資源。</p>
        </div>
        <div class="action-help">
          <button type="button" id="googleSearchButton">用 Google 延伸搜尋</button>
          <p>依行政區、主題、子主題、智慧查詢與已選線索組合搜尋，不抓取 Google 結果。</p>
        </div>
      </div>

      <section class="selected-insights" aria-label="已選資源線索">
        <div class="choice-title">
          <span>已選資源線索</span>
          <small>由已加入資源整理</small>
        </div>
        <div id="derivedIdentityChips" class="chip-row muted-chip-row"></div>
      </section>
    </section>

    <section class="summary-band">
      <div>
        <p class="eyebrow">目前範圍</p>
        <h2 id="currentScope">資源查詢</h2>
        <p id="scopeMeta">正在載入資料...</p>
      </div>
    </section>

    <div class="content-layout">
      <section id="cards" class="cards" aria-live="polite"></section>

      <aside class="package-panel" aria-label="案家資源包">
        <section class="panel sticky">
          <h2>案家資源包</h2>
          <p class="muted-text">不需要登入，資料只暫存在這台裝置；請勿填姓名、電話、身分證或完整地址。</p>
          <label class="field">
            <span>資源包暫稱</span>
            <input id="packageNameInput" type="text" placeholder="例如：板橋獨居長者資源包">
          </label>
          <label class="field">
            <span>備註</span>
            <textarea id="packageNoteInput" rows="2" placeholder="只寫情境，不寫個資，例如：疑似急難、需要物資與交通備案"></textarea>
          </label>
          <label class="field">
            <span>最近資源包</span>
            <select id="packageSelect" aria-label="最近資源包"></select>
          </label>
          <div class="package-actions">
            <button type="button" id="newPackage">新增</button>
            <button type="button" id="duplicatePackage">複製</button>
            <button type="button" id="deletePackage">刪除</button>
          </div>
          <p class="muted-text" id="packageStatus">尚未加入資源。</p>
          <div id="packageItems" class="package-items"></div>
          <label class="field">
            <span>輸出格式</span>
            <select id="packageMode">
              <option value="family">家屬版資源包</option>
              <option value="phone">電話確認清單</option>
              <option value="admin">行政申請清單</option>
              <option value="handoff">交接摘要</option>
            </select>
          </label>
          <div class="package-actions">
            <button type="button" id="generateResult">產生資源包結果</button>
            <button type="button" id="copyPackage">複製資源包</button>
            <button type="button" id="clearPackage">清空</button>
          </div>
          <textarea id="packageOutput" readonly rows="10" aria-label="資源包輸出"></textarea>
          <p class="privacy-note">家屬版會自動排除內部註記與不可公開資源。</p>
        </section>
      </aside>
    </div>
  </main>

  <template id="resourceCardTemplate">
    <article class="resource-card">
      <div class="card-head">
        <div>
          <p class="category"></p>
          <h3></h3>
        </div>
        <div class="card-badges">
          <span class="smart-hit" hidden>智慧查詢命中</span>
          <span class="confidence"></span>
        </div>
      </div>
      <p class="summary"></p>
      <div class="resource-tags">
        <span class="tag-strip eligibility"></span>
        <span class="tag-strip urgency-tags"></span>
      </div>
      <dl>
        <div><dt>下一步</dt><dd class="next-step"></dd></div>
        <div><dt>聯絡/申請</dt><dd class="contact"></dd></div>
        <div class="required-docs-row"><dt>常備文件</dt><dd class="required-docs"></dd></div>
      </dl>
      <div class="card-actions">
        <button type="button" class="add-package">加入資源包</button>
        <button type="button" class="copy-family">複製家屬說明</button>
        <button type="button" class="copy-phone">複製電話確認</button>
      </div>
      <details class="internal-details">
        <summary>查看內部註記</summary>
        <p class="internal-note"></p>
        <ul class="phone-questions"></ul>
        <ul class="risk-flags"></ul>
      </details>
      <div class="card-foot">
        <span class="checked-at"></span>
        <a class="source" target="_blank" rel="noopener noreferrer">查看來源</a>
      </div>
    </article>
  </template>

  <script src="./resource-nav.js"></script>
</body>
</html>
